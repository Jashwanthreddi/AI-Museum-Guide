<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salarjung Museum Chat Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #E3F2FD;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .museum-header {
            background: linear-gradient(135deg, #1976D2, #1565C0);
            padding: 2rem;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.2);
        }

        .museum-header h1 {
            font-family: 'Crimson Text', serif;
            color: #FFF5E1;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .museum-header p {
            color: #FFE4B5;
            font-size: 1.1rem;
        }

        .chat-container {
            background: #FFFFFF;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.1);
            overflow: hidden;
            border: 2px solid #1976D2;
        }

        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23FFF5E1" width="100" height="100"/><path fill="%23E6D5B8" fill-opacity="0.4" d="M0 0h100v100H0z" transform="translate(5 5)"/></svg>') repeat;
        }

        .welcome-message {
            background: linear-gradient(135deg, #1976D2, #2196F3);
            color: #FFF5E1;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Crimson Text', serif;
        }

        .message {
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
            position: relative;
        }

        .user-message {
            background: #1976D2;
            color: #FFFFFF;
            margin-left: auto;
        }

        .bot-message {
            background: #E3F2FD;
            color: #37474F;
            border: 1px solid #1976D2;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: #E3F2FD;
            border-top: 2px solid #1976D2;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #1976D2;
            border-radius: 25px;
            margin-right: 10px;
            font-family: 'Montserrat', sans-serif;
            background: #FFFFFF;
        }

        .chat-input input:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(139, 69, 19, 0.3);
        }

        .chat-input button {
            padding: 12px 30px;
            background: linear-gradient(45deg, #1976D2, #2196F3);
            color: #FFF5E1;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="museum-header">
            <h1>Salarjung Museum Chat Guide</h1>
            <p>Your personal guide to explore the magnificent collection</p>
        </div>
        
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <p>Welcome to Salarjung Museum! I'm your virtual guide. Ask me anything about the museum's collections, history, or exhibits.</p>
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Ask your question about Salarjung Museum...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
